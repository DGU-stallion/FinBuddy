# FinBuddy 反向代理配置（无域名 / 纯公网 IP 访问）
#
# 安装位置：/etc/nginx/conf.d/finbuddy.conf
#
# ⚠️ 本文件存在的唯一理由：**关闭 SSE 缓冲**。
# 这类应用最典型的部署故障是「功能完全正确，但 SSE 被反向代理缓冲」——
# 浏览器里表现为"一直转圈不输出"，很容易被误判成"模型慢"而去优化模型。
# Nginx 默认 `proxy_buffering on`，会把整个响应攒完再一次性发给浏览器。
#
# 判据已实测（scripts/verify-deploy.mjs 第 4 项的双判据，且用故意缓冲的代理
# 反例验证过有牙）：
#   未缓冲：首字节占比 28%，chunk 到达跨度 37373ms  → 通过
#   已缓冲：首字节占比 100%，chunk 到达跨度 1ms     → 正确失败
#
# 实测记录（本仓库，2026-10，从大陆网络发出）：
#   经 Cloudflare Quick Tunnel 转发同一台服务，8 个 chunk 挤在 44ms 内到达
#   （delta=6.292 → 6.412），而本地直连是 0.648 → 4.861 逐块到达。
#   → 隧道 / 默认开启缓冲的代理必须显式关掉缓冲，否则流式体验直接失效。

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 纯 IP 访问，没有域名可填。用 catch-all + default_server 接收任意 Host。
    server_name _;

    # 上传体积限制（本项目当前无文件上传，留出余量即可）
    client_max_body_size 8m;

    # 访问日志：排障时用 `tail -f /var/log/nginx/finbuddy.access.log`
    access_log /var/log/nginx/finbuddy.access.log;
    error_log  /var/log/nginx/finbuddy.error.log;

    location / {
        # 应用跑在 3001 而不是 3000 —— 原因见 deploy/README.md「为什么是 3001」。
        # 简短版：scripts/check-safe-build.mjs 会探测 3000 端口，若被占用就拒绝构建。
        # 应用占 3000 会让服务器上的 `npm run build` 自己把自己拦住。
        proxy_pass http://127.0.0.1:3001;

        # ─────────────── SSE 关键四项（缺一不可）───────────────
        proxy_buffering off;        # ← 最关键：不攒响应，来一块发一块
        proxy_cache off;            # 不缓存流式响应
        proxy_read_timeout 300s;    # 一次问答含多步工具循环，本机实测 30–52s
        proxy_http_version 1.1;     # SSE 需要 HTTP/1.1
        proxy_set_header Connection '';  # 清除 Connection 头，保持长连接不被改写成 close
        # ──────────────────────────────────────────────────────

        # 双保险：即使上游或未来某层重新引入缓冲，也告诉它别缓冲
        add_header X-Accel-Buffering no;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长任务期间不要因为上游慢而提前断开
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }
}
